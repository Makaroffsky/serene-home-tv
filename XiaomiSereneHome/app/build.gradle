plugins { id 'com.android.application' }

android {
    namespace 'ru.family.serenehome'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.family.serenehome'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '1.0-beta1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
